<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sign in</title><link rel="stylesheet" href="site.css"></head>
<body>
<!-- Step two of two: the password is "secret". -->
<h1>Enter your password</h1>
<p id="who" class="note"></p>
<form id="password-form">
  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password">
  <p id="error" class="error" role="alert"></p>
  <button type="submit">Sign in</button>
</form>
<script>
  document.getElementById("who").textContent = new URLSearchParams(location.search).get("email") ?? "";
  document.getElementById("password-form").addEventListener("submit", (event) => {
    event.preventDefault();
    if (document.getElementById("password").value === "secret") location.href = "home.html";
    else document.getElementById("error").textContent = "Wrong password";
  });
</script>
</body>
</html>
