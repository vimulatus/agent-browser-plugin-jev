<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sign in</title><link rel="stylesheet" href="site.css"></head>
<body>
<!-- Step one of two: any email goes on to id-first-password.html, which takes the password. -->
<h1>Sign in</h1>
<form action="id-first-password.html" method="get">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="username">
  <button type="submit">Next</button>
</form>
</body>
</html>
