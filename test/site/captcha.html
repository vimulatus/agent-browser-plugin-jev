<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Just a moment</title><link rel="stylesheet" href="site.css"></head>
<body>
<!-- No answer passes: ticking the box opens an image grid, and Verify always says "Please try again". -->
<h1>Before you continue to Acme</h1>
<p>Confirm you are a person.</p>
<label><input type="checkbox" id="robot"> I'm not a robot</label>
<div id="challenge" hidden>
  <p>Select all squares with a bicycle.</p>
  <div class="grid">
    <button type="button" aria-label="Square 1">1</button>
    <button type="button" aria-label="Square 2">2</button>
    <button type="button" aria-label="Square 3">3</button>
    <button type="button" aria-label="Square 4">4</button>
    <button type="button" aria-label="Square 5">5</button>
    <button type="button" aria-label="Square 6">6</button>
    <button type="button" aria-label="Square 7">7</button>
    <button type="button" aria-label="Square 8">8</button>
    <button type="button" aria-label="Square 9">9</button>
  </div>
  <p id="error" class="error" role="alert"></p>
  <button type="button" id="verify">Verify</button>
</div>
<script>
  document.getElementById("robot").addEventListener("change", (event) => {
    document.getElementById("challenge").hidden = !event.target.checked;
  });
  document.getElementById("verify").addEventListener("click", () => {
    document.getElementById("error").textContent = "Please try again.";
  });
</script>
</body>
</html>
